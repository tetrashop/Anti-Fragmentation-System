<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>میزان‌رو - سامانه ضد چندپارگی</title>
    <link href="/static/css/bootstrap.min.css" rel="stylesheet">
    <link href="/static/css/style.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand" href="/">🏠 سامانه ضد چندپارگی</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item"><a class="nav-link" href="/">خانه</a></li>
                    <li class="nav-item"><a class="nav-link" href="/nataq">نطق مصطلح</a></li>
                    <li class="nav-item"><a class="nav-link" href="/mizanro">میزان‌رو</a></li>
                    <li class="nav-item"><a class="nav-link" href="/anti_fragmentation">ضد چندپارگی</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <main class="container my-4">
        <div class="row">
            <div class="col-md-6">
                <div class="card">
                    <div class="card-header bg-info text-white"><h5>ورودی متن</h5></div>
                    <div class="card-body">
                        <form id="mizanro-form">
                            <div class="mb-3">
                                <label for="mizanro-input" class="form-label">متن خود را وارد کنید:</label>
                                <textarea class="form-control" id="mizanro-input" rows="6" placeholder="متن فارسی را وارد کنید..."></textarea>
                            </div>
                            <button type="submit" class="btn btn-info w-100">تحلیل</button>
                        </form>
                    </div>
                </div>
            </div>
            <div class="col-md-6">
                <div class="card">
                    <div class="card-header bg-info text-white"><h5>نتایج تحلیل</h5></div>
                    <div class="card-body">
                        <div id="mizanro-results" class="d-none">
                            <p>📝 تعداد کلمات: <strong id="word-count"></strong></p>
                            <p>📄 تعداد جملات: <strong id="sentence-count"></strong></p>
                            <p>📊 امتیاز پیچیدگی: <strong id="complexity-score"></strong></p>
                            <p>🔤 تنوع واژگانی: <strong id="lexical-diversity"></strong></p>
                            <p>📏 میانگین طول جمله: <strong id="avg-sentence-length"></strong></p>
                            <p>🆕 واژه‌های یکتا: <strong id="unique-words"></strong></p>
                        </div>
                        <div id="mizanro-loading" class="text-center d-none">
                            <div class="spinner-border text-info"></div>
                            <p class="mt-2">در حال تحلیل...</p>
                        </div>
                        <div id="mizanro-error" class="alert alert-danger d-none"></div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <footer class="bg-dark text-light py-4 mt-5">
        <div class="container text-center">
            <p>&copy; 2025 سامانه ضد چندپارگی</p>
        </div>
    </footer>

    <script src="/static/js/bootstrap.min.js"></script>
    <script src="/static/js/script.js"></script>
</body>
</html>
