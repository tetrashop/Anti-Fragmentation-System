<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تحلیل جامع - سامانه ضد چندپارگی</title>
<link href="/static/css/bootstrap.min.css" rel="stylesheet">
<link href="/static/css/style.css" rel="stylesheet">
<style>
.stat-box{background:#f8f9fa;padding:12px;border-radius:8px;margin:8px 0;border-right:3px solid #0d6efd}
.kw-tag{display:inline-block;background:#e7f1ff;color:#0d6efd;padding:4px 10px;border-radius:15px;margin:3px;font-size:13px}
.score-bar{height:10px;background:#e9ecef;border-radius:5px;overflow:hidden}
.score-fill{height:100%;background:linear-gradient(90deg,#28a745,#ffc107,#dc3545);transition:width .5s}
</style>
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-primary">
<div class="container">
<a class="navbar-brand" href="/">🏠 سامانه ضد چندپارگی</a>
<button class="navbar-toggler" data-bs-toggle="collapse" data-bs-target="#nav"><span class="navbar-toggler-icon"></span></button>
<div class="collapse navbar-collapse" id="nav">
<ul class="navbar-nav me-auto">
<li class="nav-item"><a class="nav-link" href="/">خانه</a></li>
<li class="nav-item"><a class="nav-link" href="/nataq">نطق</a></li>
<li class="nav-item"><a class="nav-link" href="/mizanro">میزان‌رو</a></li>
<li class="nav-item"><a class="nav-link" href="/anti_fragmentation">ضد چندپارگی</a></li>
<li class="nav-item"><a class="nav-link active" href="/analyze">تحلیل جامع</a></li>
</ul>
</div>
</div>
</nav>
<main class="container my-4">
<h2 class="text-center mb-4">🔍 تحلیل جامع متن</h2>
<div class="row">
<div class="col-lg-5">
<div class="card">
<div class="card-header bg-primary text-white">📝 ورودی</div>
<div class="card-body">
<textarea id="input-text" class="form-control" rows="12" placeholder="متن خود را وارد کنید..."></textarea>
<div class="form-check mt-2">
<input class="form-check-input" type="checkbox" id="use-limit">
<label class="form-check-label" for="use-limit">محدودیت طول (کلمه)</label>
<input type="number" id="max-length" class="form-control form-control-sm mt-1" value="250" disabled>
</div>
<button id="analyze-btn" class="btn btn-primary w-100 mt-3">تحلیل جامع</button>
<div id="loading" class="text-center d-none mt-3">
<div class="spinner-border text-primary"></div><p>در حال تحلیل...</p>
</div>
<div id="error" class="alert alert-danger d-none mt-3"></div>
</div>
</div>
</div>
<div class="col-lg-7">
<div id="results" class="d-none">
<div class="card mb-3">
<div class="card-header bg-success text-white">📊 آمار کلی</div>
<div class="card-body" id="stats"></div>
</div>
<div class="card mb-3">
<div class="card-header bg-info text-white">✅ متن تصحیح‌شده</div>
<div class="card-body"><p id="cleaned-text" class="bg-light p-3 rounded"></p></div>
</div>
<div class="card mb-3">
<div class="card-header bg-warning">📖 خوانایی</div>
<div class="card-body" id="readability"></div>
</div>
<div class="card mb-3">
<div class="card-header bg-dark text-white">🔑 کلیدواژه‌ها</div>
<div class="card-body" id="keywords"></div>
</div>
<div class="card mb-3">
<div class="card-header bg-secondary text-white">📄 خلاصه</div>
<div class="card-body">
<p id="summary" class="bg-light p-3 rounded"></p>
<small class="text-muted" id="summary-meta"></small>
</div>
</div>
</div>
</div>
</div>
</main>
<footer class="bg-dark text-light py-4 mt-5"><div class="container text-center"><p>&copy; 2025 سامانه ضد چندپارگی</p></div></footer>
<script src="/static/js/bootstrap.min.js"></script>
<script>
document.getElementById('use-limit').addEventListener('change', function(){
    document.getElementById('max-length').disabled = !this.checked;
});
document.getElementById('analyze-btn').addEventListener('click', async () => {
    const text = document.getElementById('input-text').value.trim();
    const errorDiv = document.getElementById('error');
    const resultsDiv = document.getElementById('results');
    const loadingDiv = document.getElementById('loading');
    if (!text) { errorDiv.textContent = 'لطفاً متن وارد کنید'; errorDiv.classList.remove('d-none'); return; }
    errorDiv.classList.add('d-none');
    resultsDiv.classList.add('d-none');
    loadingDiv.classList.remove('d-none');
    const payload = { text: text };
    if (document.getElementById('use-limit').checked) {
        payload.max_length = parseInt(document.getElementById('max-length').value) || 250;
    }
    try {
        const res = await fetch('/analyze', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
        });
        const data = await res.json();
        loadingDiv.classList.add('d-none');
        if (!data.success) { errorDiv.textContent = data.error || 'خطا'; errorDiv.classList.remove('d-none'); return; }
        const s = data.stats;
        document.getElementById('stats').innerHTML = `
            <div class="stat-box">📝 کلمات: <strong>${s.word_count}</strong></div>
            <div class="stat-box">📄 جملات: <strong>${s.sentence_count}</strong></div>
            <div class="stat-box">🔤 کاراکترها: <strong>${s.char_count}</strong></div>
            ${data.limit ? `<div class="stat-box">⏱ باقی‌مانده: <strong>${data.limit.remaining}</strong> کلمه ${data.limit.exceeded ? '⚠️ (فراتر از حد)' : ''}</div>` : ''}
        `;
        document.getElementById('cleaned-text').textContent = data.cleaned_text;
        const r = data.readability;
        document.getElementById('readability').innerHTML = `
            <div class="stat-box">
                <strong>امتیاز خوانایی: ${r.readability_score}/100</strong> - ${r.level}
                <div class="score-bar mt-2"><div class="score-fill" style="width:${r.readability_score}%"></div></div>
            </div>
            <div class="stat-box">میانگین طول جمله: ${r.avg_sentence_length} کلمه</div>
            <div class="stat-box">زمان مطالعه تخمینی: ${r.estimated_reading_time_min} دقیقه</div>
            <div class="stat-box">${r.recommendations.map(x => '💡 ' + x).join('<br>')}</div>
        `;
        document.getElementById('keywords').innerHTML = data.keywords.map(k =>
            `<span class="kw-tag">${k.word} <small>(${k.frequency})</small></span>`
        ).join('') || '<em>کلیدواژه‌ای یافت نشد</em>';
        document.getElementById('summary').textContent = data.summary;
        document.getElementById('summary-meta').textContent =
            `فشرده‌سازی: ${Math.round((1 - data.summary.length / data.cleaned_text.length) * 100)}%`;
        resultsDiv.classList.remove('d-none');
    } catch (e) {
        loadingDiv.classList.add('d-none');
        errorDiv.textContent = 'خطا در ارتباط: ' + e.message;
        errorDiv.classList.remove('d-none');
    }
});
</script>
</body>
</html>
