<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نطق مصطلح - سامانه ضد چندپارگی</title>
    <link href="/static/css/bootstrap.min.css" rel="stylesheet">
    <link href="/static/css/style.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand" href="/">🏠 سامانه ضد چندپارگی</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item"><a class="nav-link" href="/">خانه</a></li>
                    <li class="nav-item"><a class="nav-link" href="/nataq">نطق مصطلح</a></li>
                    <li class="nav-item"><a class="nav-link" href="/mizanro">میزان‌رو</a></li>
                    <li class="nav-item"><a class="nav-link" href="/anti_fragmentation">ضد چندپارگی</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <main class="container my-4">
        <div class="row">
            <div class="col-md-6">
                <div class="card">
                    <div class="card-header bg-primary text-white"><h5>ورودی متن</h5></div>
                    <div class="card-body">
                        <form id="nataq-form">
                            <div class="mb-3">
                                <label for="nataq-input" class="form-label">متن خود را وارد کنید:</label>
                                <textarea class="form-control" id="nataq-input" rows="6" placeholder="متن فارسی را وارد کنید..."></textarea>
                            </div>
                            <button type="submit" class="btn btn-primary w-100">پردازش</button>
                        </form>
                    </div>
                </div>
            </div>
            <div class="col-md-6">
                <div class="card">
                    <div class="card-header bg-primary text-white"><h5>نتایج پردازش</h5></div>
                    <div class="card-body">
                        <div id="nataq-results" class="d-none">
                            <h6>متن پردازش شده:</h6>
                            <p id="processed-text" class="bg-light p-3 rounded"></p>
                        </div>
                        <div id="nataq-loading" class="text-center d-none">
                            <div class="spinner-border text-primary"></div>
                            <p class="mt-2">در حال پردازش...</p>
                        </div>
                        <div id="nataq-error" class="alert alert-danger d-none"></div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <footer class="bg-dark text-light py-4 mt-5">
        <div class="container text-center">
            <p>&copy; 2025 سامانه ضد چندپارگی</p>
        </div>
    </footer>

    <script src="/static/js/bootstrap.min.js"></script>
    <script src="/static/js/script.js"></script>
</body>
</html>
